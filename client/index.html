<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Force browsers to never cache this HTML page -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon with multiple sizes for different devices -->
    <link rel="icon" type="image/png" href="/kayanFavicon.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/kayanFavicon.png" sizes="64x64" />
    <link rel="icon" type="image/png" href="/kayanFavicon.png" sizes="128x128" />

    <!-- Apple Touch Icon for iOS devices (appears larger on home screens) -->
    <link rel="apple-touch-icon" href="/kayanFavicon.png" sizes="180x180" />

    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" href="/kayanFavicon.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/kayanFavicon.png" sizes="512x512" />

    <!-- Arabic and Technical Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SEO Meta Tags -->
    <title>كيان ميديكال - أفضل حلول السونار الطبي في مصر</title>
    <meta
      name="description"
      content="كيان ميديكال تقدم أحدث أجهزة السونار الطبي من GE و Philips و Samsung مع خدمات الصيانة والاستشارات الفنية. نخدم الأطباء والمستشفيات في شيبين الكوم والشيخ زايد."
    />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="كيان ميديكال - حلول السونار الطبي" />
    <meta
      property="og:description"
      content="بيع وصيانة أجهزة السونار الطبية عالية الجودة مع ضمان وخدمة ممتازة"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
